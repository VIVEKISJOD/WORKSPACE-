          You are a master of coding, app and web design, motion graphics, video editing and every skill needed to build this project. The user has NO coding experience and works only from an Android tablet.
          Rules:
          1. Create every file yourself, complete and ready to upload. Never ask the user to edit code or run commands.
          2. One file per code block with its filename. Say exactly where each file goes.
          3. Keep replies short and in plain words. Ask at most one question at a time.
          4. Work one step at a time. After each step, tell the user exactly how to test it.
          5. Be honest about anything you could not test or are unsure about.
          6. Keep everything free by default; mention costs before suggesting anything paid.
          7. Never put keys or passwords in project files.
          8. Keep the UI clean, minimal and high-contrast. No glowing gradients, no purple neon.
          """.trimIndent()

              private lateinit var prefs: SharedPreferences
              private lateinit var homeHolder: FrameLayout
              private lateinit var work: LinearLayout
              private lateinit var container: FrameLayout
              private lateinit var titleView: TextView
              private lateinit var strip: LinearLayout
              private val views = HashMap<String, WebView>()
              private var project = "Default"
              private var site = "GitHub"
              private var inHome = true
              private var fileCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  prefs = getSharedPreferences("ws", MODE_PRIVATE)
                  setTheme(
                      if (isLight()) android.R.style.Theme_DeviceDefault_Light_NoActionBar
                      else android.R.style.Theme_DeviceDefault_NoActionBar
                  )
                  super.onCreate(savedInstanceState)
                  loadTheme()
                  project = prefs.getString("project", "Default") ?: "Default"
                  site = prefs.getString("defaultTab", "GitHub") ?: "GitHub"
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  if (!prefs.getBoolean("mig_chat", false)) {
                      for (p in projects()) {
                          val e = enabledFor(p)
                          if (e != null) saveEnabled(p, listOf("AI Chat") + e.toList())
                      }
                      prefs.edit().putBoolean("mig_chat", true).apply()
                  }
                  buildUi()
                  val filter = IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(dlReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(dlReceiver, filter)
                  }
                  startKeepAlive()
                  showHome()
              }

              // ---------- small helpers ----------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()

              private fun rounded(fill: Int, radius: Int, stroke: Int? = null): GradientDrawable =
                  GradientDrawable().apply {
                      cornerRadius = dp(radius).toFloat()
                      setColor(fill)
                      if (stroke != null) setStroke(dp(1), stroke)
                  }

              private fun tv(t: String, size: Float, color: Int, bold: Boolean = false): TextView =
                  TextView(this).apply {
                      text = t
                      textSize = size * fs
                      setTextColor(color)
                      if (bold) setTypeface(null, Typeface.BOLD)
                  }

              private fun lp(w: Int, h: Int, weight: Float = 0f) =
                  LinearLayout.LayoutParams(w, h, weight).apply {
                      setMargins(dp(4), dp(2), dp(4), dp(2))
                  }

              private fun chip(label: String, active: Boolean): TextView = TextView(this).apply {
                  this.text = label
                  textSize = 14f * fs
                  setSingleLine(true)
                  gravity = Gravity.CENTER_VERTICAL
                  setTextColor(if (active) cText else cSub)
                  setPadding(dp(14), dp(10), dp(14), dp(10))
                  background = rounded(if (active) cActive else cCard, 10, cStroke)
              }

              private fun icon(t: String, size: Float, onClick: (View) -> Unit): TextView =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      gravity = Gravity.CENTER
                      setTextColor(cText)
                      minWidth = dp(48)
                      minHeight = dp(48)
                      setOnClickListener { onClick(it) }
                  }

              // ---------- screens ----------

              private fun buildUi() {
                  val root = FrameLayout(this)
                  root.setBackgroundColor(bg)
                  homeHolder = FrameLayout(this)
                  work = buildWork()
                  root.addView(homeHolder, FrameLayout.LayoutParams(MATCH, MATCH))
                  root.addView(work, FrameLayout.LayoutParams(MATCH, MATCH))
                  setContentView(root)
              }

              private fun buildWork(): LinearLayout {
                  val w = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                  }

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), 0, dp(4), 0)
                  }
                  bar.addView(icon("\u2039", 30f) { showHome() })
                  titleView = tv("", 17f, cText, true).apply {
                      setSingleLine(true)
                      ellipsize = TextUtils.TruncateAt.END
                      setOnClickListener { quickSwitch() }
                  }
                  bar.addView(titleView, LinearLayout.LayoutParams(0, WRAP, 1f))
                  bar.addView(icon("\u22EE", 22f) { showMenu(it) })
                  w.addView(bar, LinearLayout.LayoutParams(MATCH, dp(52)))

                  strip = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(4), 0, dp(4), 0)
                  }
                  val scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(strip)
                  }
                  w.addView(scroll, LinearLayout.LayoutParams(MATCH, WRAP))

                  val line = View(this).apply { setBackgroundColor(cStroke) }
                  w.addView(line, LinearLayout.LayoutParams(MATCH, dp(1)))

                  container = FrameLayout(this)
                  w.addView(container, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  return w
              }

              private fun showHome() {
                  inHome = true
                  homeHolder.removeAllViews()
                  homeHolder.addView(buildHome(), FrameLayout.LayoutParams(MATCH, MATCH))
                  homeHolder.visibility = View.VISIBLE
                  work.visibility = View.GONE
              }

              private fun openProject(name: String) {
                  project = name
                  prefs.edit().putString("project", project).apply()
                  site = prefs.getString("defaultTab", "GitHub") ?: "GitHub"
                  inHome = false
                  homeHolder.visibility = View.GONE
                  work.visibility = View.VISIBLE
                  showTab()
              }

              private fun tabsSummary(name: String): String {
                  val all = sites()
                  val e = enabledFor(name)
                  val list = if (e == null) all else all.filter { it.name in e }
                  return list.joinToString("  \u00B7  ") { it.name }
              }

              private fun buildHome(): ScrollView {
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(bg)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(36), dp(20), dp(32))
                  }
                  col.addView(tv("Workspace", 30f, cText, true))
                  col.addView(tv("Pick a project to continue", 14f, cSub).apply {
                      setPadding(0, dp(4), 0, dp(28))
                  })
                  col.addView(tv("PROJECTS", 12f, cSub, true).apply {
                      letterSpacing = 0.1f
                      setPadding(0, 0, 0, dp(10))
                  })

                  for (name in projects()) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(18), dp(16), dp(18), dp(16))
                          background = rounded(cCard, 14, cStroke)
                          setOnClickListener { openProject(name) }
                          setOnLongClickListener { projectOptions(name); true }
                      }
                      card.addView(tv(name, 18f, cText, true))
                      card.addView(tv(tabsSummary(name), 13f, cSub).apply { setPadding(0, dp(4), 0, 0) })
                      col.addView(card, LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(10) })
                  }

                  col.addView(tv("Press and hold a project to delete it", 12f, cSub).apply {
                      setPadding(dp(2), dp(2), 0, dp(14))
                  })

                  val newBtn = tv("+  New project", 16f, Color.WHITE, true).apply {
                      gravity = Gravity.CENTER
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = rounded(cAccent, 14)
                      setOnClickListener { newProject() }
                  }
                  col.addView(newBtn, LinearLayout.LayoutParams(MATCH, WRAP))

                  val settingsBtn = tv("Settings", 15f, cText).apply {
                      gravity = Gravity.CENTER
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = rounded(cCard, 14, cStroke)
                      setOnClickListener { settingsDialog() }
                  }
                  col.addView(settingsBtn, LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(10) })

                  col.addView(tv("SUGGESTED SITES", 12f, cSub, true).apply {
                      letterSpacing = 0.1f
                      setPadding(0, dp(28), 0, dp(10))
                  })
                  for (pair in suggested) {
                      val s = pair.first
                      val added = sites().any { it.name == s.name }
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(16), dp(12), dp(16), dp(12))
                          background = rounded(cCard, 12, cStroke)
                          if (!added) {
                              setOnClickListener {
                                  saveCustomSites(customSites() + s)
                                  toast("Added. Turn it on with Tabs inside a project.")
                                  showHome()
                              }
                          }
                      }
                      row.addView(tv(if (added) s.name + "  \u2713 added" else "+  " + s.name, 15f, cText, true))
                      row.addView(tv(pair.second, 12f, cSub).apply { setPadding(0, dp(2), 0, 0) })
                      col.addView(row, LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = dp(8) })
                  }

                  sv.addView(col)
                  return sv
              }

              private fun quickSwitch() {
                  val list = projects()
                  val items = (list.map { if (it == project) "\u2713 $it" else it } + "Home").toTypedArray()
                  AlertDialog.Builder(this).setTitle("Switch project").setItems(items) { _, i ->
                      if (i < list.size) {
                          if (list[i] != project) openProject(list[i])
                      } else {
                          showHome()
                      }
                  }.show()
              }

              private fun fontLabel(): String = when (prefs.getString("fontScale", "1.0")) {
                  "0.9" -> "Small"
                  "1.15" -> "Large"
                  else -> "Normal"
              }

              private fun backupSettings() {
                  val o = JSONObject()
                  for ((k, v) in prefs.all) {
                      if (k.startsWith("vault_") || k.startsWith("hist_") || k.startsWith("use_") ||
                          k.startsWith("ex_") || k.startsWith("key") || k == "handoff_next"
                      ) continue
                      if (v is String || v is Boolean) o.put(k, v)
                  }
                  val cb = getSystemService(ClipboardManager::class.java)
                  cb.setPrimaryClip(ClipData.newPlainText("workspace settings", o.toString()))
                  toast("Settings copied. Paste them into a note to keep them safe.")
              }

              private fun restoreSettings(after: () -> Unit) {
                  val cb = getSystemService(ClipboardManager::class.java)
                  val t = cb.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString() ?: ""
                  val o = try {
                      JSONObject(t)
                  } catch (e: Exception) {
                      null
                  }
                  if (o == null || !o.has("projects")) {
                      toast("Copy your settings backup first, then tap Restore")
                      return
                  }
                  AlertDialog.Builder(this).setTitle("Restore settings?")
                      .setMessage("This replaces your projects, tabs, sites and base prompt. Keys are not included in backups, so add them again in AI Chat.")
                      .setPositiveButton("Restore") { _, _ ->
                          val e = prefs.edit()
                          val it = o.keys()
                          while (it.hasNext()) {
                              val k = it.next()
                              if (k.startsWith("vault_") || k.startsWith("key")) continue
                              val v = o.get(k)
                              if (v is String) e.putString(k, v) else if (v is Boolean) e.putBoolean(k, v)
                          }
                          e.apply()
                          after()
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun projectOptions(name: String) {
                  AlertDialog.Builder(this).setTitle(name)
                      .setItems(arrayOf("Open", "Delete")) { _, i ->
                          if (i == 0) openProject(name) else confirmDelete(name)
                      }.show()
              }

              private fun confirmDelete(name: String) {
                  if (projects().size <= 1) {
                      toast("Keep at least one project")
                      return
                  }
                  AlertDialog.Builder(this).setTitle("Delete $name?")
                      .setMessage("Its tabs and settings are removed from this app.")
                      .setPositiveButton("Delete") { _, _ ->
                          val left = projects().filter { it != name }
                          saveProjects(left)
                          prefs.edit().remove("tabs_$name").remove("bp_$name").apply()
                          val dead = views.keys.filter { it.startsWith("$name::") }
                          for (k in dead) {
                              views.remove(k)?.let { container.removeView(it); it.destroy() }
                          }
                          if (project == name) {
                              project = left.first()
                              prefs.edit().putString("project", project).apply()
                          }
                          showHome()
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun showMenu(anchor: View) {
                  val pm = PopupMenu(this, anchor)
                  val m = pm.menu
                  m.add(0, 1, 0, "Tabs")
                  m.add(0, 2, 1, "Add site")
                  m.add(0, 3, 2, "Reload")
                  val d = m.add(0, 4, 3, "Desktop site")
                  d.isCheckable = true
                  d.isChecked = desktopMode()
                  m.add(0, 5, 4, "Settings")
                  pm.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          1 -> editTabs()
                          2 -> addSite()
                          3 -> current()?.reload()
                          4 -> {
                              prefs.edit().putBoolean("desktop", !desktopMode()).apply()
                              applyDesktopToAll()
                          }
                          5 -> settingsDialog()
                      }
                      true
                  }
                  pm.show()
              }

              // ---------- settings values ----------

              private fun keepAlive() = prefs.getBoolean("keepAlive", true)
              private fun desktopMode() = prefs.getBoolean("desktop", false)
              private fun baseText() = prefs.getString("basePrompt", null) ?: DEFAULT_BASE

              private fun userAgent(): String =
                  if (desktopMode()) DESKTOP_UA
                  else WebSettings.getDefaultUserAgent(this).replace("; wv", "").replace("Version/4.0 ", "")

              // ---------- projects & sites ----------

              private fun projects(): List<String> =
                  (prefs.getString("projects", "Default") ?: "Default")
                      .split("\n").filter { it.isNotBlank() }.ifEmpty { listOf("Default") }

              private fun saveProjects(list: List<String>) =
                  prefs.edit().putString("projects", list.joinToString("\n")).apply()

              private fun customSites(): List<Site> =
                  (prefs.getString("sites", "") ?: "").split("\n")
                      .filter { it.contains("|") }
                      .map { Site(it.substringBefore("|"), it.substringAfter("|")) }

              private fun saveCustomSites(list: List<Site>) =
                  prefs.edit().putString("sites", list.joinToString("\n") { it.name + "|" + it.url }).apply()

              private fun sites(): List<Site> = defaults + customSites()

              private fun urlOf(name: String) =
                  sites().firstOrNull { it.name == name }?.url ?: "https://github.com"

              private fun current(): WebView? = views["$project::$site"]

              private fun profileName() = "p_" + Integer.toHexString(project.hashCode())

              // Which tabs are switched on for a project (null = all).
              private fun enabledFor(p: String): Set<String>? {
                  val s = prefs.getString("tabs_$p", null) ?: return null
                  return s.split("\n").filter { it.isNotBlank() }.toSet()
              }

              private fun saveEnabled(p: String, names: List<String>) =
                  prefs.edit().putString("tabs_$p", names.joinToString("\n")).apply()

              private fun visibleSites(): List<Site> {
                  val all = sites()
                  val e = enabledFor(project) ?: return all
                  val v = all.filter { it.name in e }
                  return if (v.isEmpty()) listOf(all.first()) else v
              }

              private fun ensureSite() {
                  val v = visibleSites()
                  if (v.none { it.name == site }) site = v.first().name
              }

              private fun newProject() {
                  val input = EditText(this).apply { hint = "Project name" }
                  AlertDialog.Builder(this).setTitle("New project").setView(input)
                      .setPositiveButton("Next") { _, _ ->
                          val name = input.text.toString().trim().replace("\n", " ")
                          if (name.isNotEmpty()) pickTemplate(name)
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun pickTemplate(name: String) {
                  val templates = listOf<Pair<String, List<String>?>>(
                      Pair("Web app", listOf("AI Chat", "GitHub", "Cloudflare", "Claude")),
                      Pair("Game", listOf("AI Chat", "GitHub", "Claude")),
                      Pair("Store", listOf("AI Chat", "GitHub", "Cloudflare", "Firebase", "Claude")),
                      Pair("Blank (all tabs)", null)
                  )
                  val labels = templates.map { it.first }.toTypedArray()
                  AlertDialog.Builder(this).setTitle("Start from").setItems(labels) { _, i ->
                      val list = projects()
                      if (name !in list) saveProjects(list + name)
                      val tabs = templates[i].second
                      if (tabs != null) saveEnabled(name, tabs)
                      openProject(name)
                      editTabs()
                  }.show()
              }

              private fun editTabs() {
                  val all = sites()
                  val names = all.map { it.name }.toTypedArray()
                  val cur = enabledFor(project) ?: names.toSet()
                  val checked = BooleanArray(all.size) { names[it] in cur }
                  AlertDialog.Builder(this).setTitle("Tabs for $project")
                      .setMultiChoiceItems(names, checked) { _, i, c -> checked[i] = c }
                      .setPositiveButton("Save") { _, _ ->
                          val chosen = names.filterIndexed { i, _ -> checked[i] }
                          if (chosen.isEmpty()) {
                              toast("Keep at least one tab on")
                          } else {
                              saveEnabled(project, chosen)
                              showTab()
                          }
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun addSite() {
                  val input = EditText(this).apply {
                      hint = "example.com"
                      inputType = InputType.TYPE_TEXT_VARIATION_URI
                  }
                  AlertDialog.Builder(this).setTitle("Add site").setView(input)
                      .setPositiveButton("Add") { _, _ ->
                          var u = input.text.toString().trim()
                          if (u.isNotEmpty()) {
                              if (!u.startsWith("http")) u = "https://$u"
                              val name = Uri.parse(u).host?.removePrefix("www.") ?: u
                              if (sites().none { it.name == name }) {
                                  saveCustomSites(customSites() + Site(name, u))
                                  val e = enabledFor(project)
                                  if (e != null) saveEnabled(project, e.toList() + name)
                              }
                              site = name
                              showTab()
                          }
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun removeSite(s: Site) {
                  AlertDialog.Builder(this).setTitle("Remove " + s.name + "?")
                      .setPositiveButton("Remove") { _, _ ->
                          saveCustomSites(customSites().filter { it.name != s.name })
                          val dead = views.keys.filter { it.endsWith("::" + s.name) }
                          for (k in dead) {
                              views.remove(k)?.let { container.removeView(it); it.destroy() }
                          }
                          if (site == s.name) site = "GitHub"
                          showTab()
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun refreshStrip() {
                  strip.removeAllViews()
                  for (s in visibleSites()) {
                      val sel = s.name == site
                      val item = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                      val label = tv(s.name, 15f, if (sel) cText else cSub, sel).apply {
                          setSingleLine(true)
                          setPadding(dp(16), dp(12), dp(16), dp(10))
                      }
                      val ind = View(this).apply {
                          setBackgroundColor(if (sel) cAccent else Color.TRANSPARENT)
                      }
                      item.addView(label, LinearLayout.LayoutParams(WRAP, WRAP))
                      item.addView(ind, LinearLayout.LayoutParams(MATCH, dp(3)))
                      item.setOnClickListener {
                          site = s.name
                          showTab()
                      }
                      if (defaults.none { it.name == s.name }) {
                          item.setOnLongClickListener { removeSite(s); true }
                      }
                      strip.addView(item, LinearLayout.LayoutParams(WRAP, WRAP))
                  }
              }

              // ---------- settings screen ----------

              private fun settingsDialog() {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(12), dp(20), dp(4))
                  }

                  fun toggle(label: String, key: String, def: Boolean, onChange: () -> Unit) {
                      val sw = Switch(this)
                      sw.text = label
                      sw.isChecked = prefs.getBoolean(key, def)
                      sw.setPadding(0, dp(10), 0, dp(10))
                      sw.setOnCheckedChangeListener { _, c ->
                          prefs.edit().putBoolean(key, c).apply()
                          onChange()
                      }
                      col.addView(sw, LinearLayout.LayoutParams(MATCH, WRAP))
                  }

                  toggle("Keep tabs alive (no reload when switching)", "keepAlive", true) { }
                  toggle("Desktop site", "desktop", false) { applyDesktopToAll() }

                  var dlg: AlertDialog? = null

                  val themeBtn = chip("Theme: " + (if (isLight()) "Light" else "Dark"), false)
                  themeBtn.setOnClickListener {
                      prefs.edit().putString("theme", if (isLight()) "dark" else "light").apply()
                      dlg?.dismiss()
                      recreate()
                  }
                  col.addView(themeBtn, lp(WRAP, WRAP))

                  val fontBtn = chip("Text size: " + fontLabel(), false)
                  fontBtn.setOnClickListener {
                      val next = when (prefs.getString("fontScale", "1.0")) {
                          "0.9" -> "1.0"
                          "1.0" -> "1.15"
                          else -> "0.9"
                      }
                      prefs.edit().putString("fontScale", next).apply()
                      dlg?.dismiss()
                      recreate()
                  }
                  col.addView(fontBtn, lp(WRAP, WRAP))

                  val defBtn = chip("Default tab: " + (prefs.getString("defaultTab", "GitHub") ?: "GitHub"), false)
                  defBtn.setOnClickListener {
                      val all = sites()
                      val names = all.map { it.name }.toTypedArray()
                      AlertDialog.Builder(this).setTitle("Default tab on open").setItems(names) { _, i ->
                          prefs.edit().putString("defaultTab", names[i]).apply()
                          defBtn.text = "Default tab: " + names[i]
                      }.show()
                  }
                  col.addView(defBtn, lp(WRAP, WRAP))

                  val bpBtn = chip("Base Prompt", false)
                  bpBtn.setOnClickListener { baseDialog() }
                  col.addView(bpBtn, lp(WRAP, WRAP))

                  val backBtn = chip("Back up settings (copy)", false)
                  backBtn.setOnClickListener { backupSettings() }
                  col.addView(backBtn, lp(WRAP, WRAP))

                  val restBtn = chip("Restore settings (from copy)", false)
                  restBtn.setOnClickListener {
                      restoreSettings {
                          dlg?.dismiss()
                          recreate()
                      }
                  }
                  col.addView(restBtn, lp(WRAP, WRAP))

                  dlg = AlertDialog.Builder(this).setTitle("Settings").setView(ScrollView(this).apply { addView(col) })
                      .setPositiveButton("Close", null).show()
              }

              private fun applyDesktopToAll() {
                  val d = desktopMode()
                  for (v in views.values) {
                      if (v.url?.startsWith("file:") == true) continue
                      v.settings.userAgentString = userAgent()
                      v.settings.useWideViewPort = d
                      v.settings.loadWithOverviewMode = d
                      v.reload()
                  }
              }

              private fun baseDialog() {
                  val multi = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), 0)
                  }
                  fun label(t: String) = TextView(this).apply {
                      text = t
                      textSize = 13f
                      setPadding(0, dp(8), 0, dp(4))
                  }

                  val g = EditText(this).apply {
                      setText(baseText())
                      minLines = 6
                      gravity = Gravity.TOP
                      inputType = multi
                  }
                  val p = EditText(this).apply {
                      setText(prefs.getString("bp_$project", "") ?: "")
                      hint = "Extra rules only for this project (optional)"
                      minLines = 3
                      gravity = Gravity.TOP
                      inputType = multi
                  }

                  col.addView(label("Base prompt (every AI reads this first)"))
                  col.addView(g)
                  if (!inHome) {
                      col.addView(label("Extra for project: $project"))
                      col.addView(p)
                  }

                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row.addView(chip("Copy", false).apply {
                      setOnClickListener {
                          val cb = getSystemService(ClipboardManager::class.java)
                          cb.setPrimaryClip(ClipData.newPlainText("base prompt", g.text.toString()))
                          toast("Copied")
                      }
                  }, lp(WRAP, WRAP))
                  row.addView(chip("Paste", false).apply {
                      setOnClickListener {
                          val cb = getSystemService(ClipboardManager::class.java)
                          val t = cb.primaryClip?.getItemAt(0)?.coerceToText(this@MainActivity)?.toString()
                          if (!t.isNullOrEmpty()) g.setText(t) else toast("Nothing to paste")
                      }
                  }, lp(WRAP, WRAP))
                  row.addView(chip("Preview", false).apply {
                      setOnClickListener {
                          val all = g.text.toString() + "\n\n" + (if (inHome) "" else p.text.toString())
                          AlertDialog.Builder(this@MainActivity).setTitle("What the AI will read")
                              .setMessage(all.trim()).setPositiveButton("OK", null).show()
                      }
                  }, lp(WRAP, WRAP))
                  col.addView(row)

                  AlertDialog.Builder(this).setTitle("Base Prompt")
                      .setView(ScrollView(this).apply { addView(col) })
                      .setPositiveButton("Save") { _, _ ->
                          val e = prefs.edit().putString("basePrompt", g.text.toString())
                          if (!inHome) e.putString("bp_$project", p.text.toString())
                          e.apply()
                          toast("Saved")
                      }
                      .setNeutralButton("Reset") { _, _ ->
                          prefs.edit().remove("basePrompt").apply()
                          toast("Back to the default text")
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              // ---------- tabs ----------

              private fun cookiesFor(url: String): String {
                  return try {
                      val cm = if (WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE)) {
                          ProfileStore.getInstance().getOrCreateProfile(profileName()).cookieManager
                      } else {
                          CookieManager.getInstance()
                      }
                      cm.getCookie(url) ?: ""
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun forceDesktop(view: WebView?) {
                  if (view == null || !desktopMode()) return
                  if (view.url?.startsWith("file:") == true) return
                  view.evaluateJavascript(DESKTOP_JS, null)
                  view.postDelayed({ view.evaluateJavascript(DESKTOP_JS, null) }, 700)
              }

              private val dlUrls = HashMap<Long, String>()

              private val dlReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val id = intent?.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L) ?: return
                      val url = dlUrls[id] ?: return
                      dlUrls.remove(id)
                      val dm = getSystemService(DownloadManager::class.java)
                      val q = dm.query(DownloadManager.Query().setFilterById(id))
                      if (q != null) {
                          if (q.moveToFirst()) {
                              val st = q.getInt(q.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                              if (st == DownloadManager.STATUS_FAILED) offerBrowser(url)
                          }
                          q.close()
                      }
                  }
              }

              private fun offerBrowser(url: String) {
                  AlertDialog.Builder(this).setTitle("Download did not work")
                      .setMessage("Open it in your browser instead?")
                      .setPositiveButton("Open in browser") { _, _ ->
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                          } catch (e: Exception) {
                              toast("No browser found")
                          }
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun receiveBlob(msg: String) {
                  runOnUiThread {
                      if (msg.startsWith("ERR|")) {
                          toast("Download failed")
                          return@runOnUiThread
                      }
                      val p = msg.split("|", limit = 3)
                      if (p.size < 3) {
                          toast("Download failed")
                          return@runOnUiThread
                      }
                      try {
                          saveToDownloads(p[0], Base64.decode(p[2], Base64.DEFAULT))
                      } catch (e: Exception) {
                          toast("Download failed")
                      }
                  }
              }

              private fun saveToDownloads(name: String, bytes: ByteArray) {
                  val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_")
                  if (Build.VERSION.SDK_INT < 29) {
                      toast("Saving needs Android 10 or newer")
                      return
                  }
                  try {
                      val ext = safe.substringAfterLast('.', "").lowercase()
                      val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                      val v = ContentValues()
                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, safe)
                      v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                      if (uri == null) {
                          toast("Could not save")
                          return
                      }
                      contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                      toast("Saved in Downloads: " + safe)
                  } catch (e: Exception) {
                      toast("Could not save")
                  }
              }

              // Sign-in pages (like "Continue with Google") open a pop-up window.
              private fun makePopup(): WebView {
                  val p = WebView(this)
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE)) {
                      try {
                          WebViewCompat.setProfile(p, profileName())
                      } catch (e: Exception) {
                      }
                  }
                  p.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      userAgentString = userAgent()
                      javaScriptCanOpenWindowsAutomatically = true
                  }
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                      try {
                          WebSettingsCompat.setRequestedWithHeaderOriginAllowList(p.settings, emptySet())
                      } catch (e: Exception) {
                      }
                  }
                  CookieManager.getInstance().setAcceptThirdPartyCookies(p, true)
                  p.webViewClient = WebViewClient()
                  return p
              }

              private fun makeWebView(chat: Boolean): WebView {
                  val wv = WebView(this)
                  // Each project gets its own isolated cookies / storage / cache.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE)) {
                      try {
                          WebViewCompat.setProfile(wv, profileName())
                      } catch (e: Exception) {
                      }
                  }
                  wv.setBackgroundColor(bg)
                  wv.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = false
                      userAgentString = userAgent()
                      useWideViewPort = desktopMode() && !chat
                      loadWithOverviewMode = desktopMode() && !chat
                      javaScriptCanOpenWindowsAutomatically = true
                      setSupportMultipleWindows(true)
                      setSupportZoom(true)
                      builtInZoomControls = true
                      displayZoomControls = false
                  }
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                      try {
                          WebSettingsCompat.setRequestedWithHeaderOriginAllowList(wv.settings, emptySet())
                      } catch (e: Exception) {
                      }
                  }
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true)
                  wv.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          forceDesktop(view)
                      }

                      override fun doUpdateVisitedHistory(view: WebView?, url: String?, isReload: Boolean) {
                          forceDesktop(view)
                      }
                  }
                  if (chat) {
                      wv.webViewClient = object : WebViewClient() {
                          override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean = true
                      }
                      wv.addJavascriptInterface(ChatBridge(this, wv, project, prefs) { baseText() }, "Native")
                  }
                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onCreateWindow(
                          view: WebView?, isDialog: Boolean, isUserGesture: Boolean, resultMsg: Message?
                      ): Boolean {
                          val msg = resultMsg ?: return false
                          val transport = msg.obj as? WebView.WebViewTransport ?: return false
                          val popup = makePopup()
                          val d = Dialog(this@MainActivity, android.R.style.Theme_DeviceDefault_NoActionBar)
                          popup.webChromeClient = object : WebChromeClient() {
                              override fun onCloseWindow(window: WebView?) {
                                  d.dismiss()
                              }
                          }
                          d.setContentView(popup)
                          d.setOnDismissListener { popup.destroy() }
                          d.show()
                          d.window?.setLayout(MATCH, MATCH)
                          transport.webView = popup
                          msg.sendToTarget()
                          return true
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          callback: ValueCallback<Array<Uri>>?,
                          params: FileChooserParams?
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          val intent: Intent = try {
                              params!!.createIntent()
                          } catch (e: Exception) {
                              Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          }
                          return try {
                              startActivityForResult(intent, 100)
                              true
                          } catch (e: Exception) {
                              fileCallback = null
                              false
                          }
                      }
                  }
                  if (!chat && WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) {
                      try {
                          // Lets the Claude site hand over files it builds in the page (blob links).
                          WebViewCompat.addWebMessageListener(
                              wv, "WsDl", setOf("https://claude.ai")
                          ) { _, message: WebMessageCompat, _, _, _ ->
                              receiveBlob(message.data ?: "")
                          }
                      } catch (e: Exception) {
                      }
                  }
                  wv.setDownloadListener { url, ua, cd, mime, _ ->
                      val name = URLUtil.guessFileName(url, cd, mime)
                      try {
                          if (url.startsWith("blob:")) {
                              val js = "(function(){var u=" + JSONObject.quote(url) + ";var n=" + JSONObject.quote(name) +
                                  ";fetch(u).then(function(r){return r.blob()}).then(function(b){" +
                                  "var f=new FileReader();f.onloadend=function(){var d=String(f.result);" +
                                  "window.WsDl.postMessage(n+'|'+(b.type||'')+'|'+d.substring(d.indexOf(',')+1));};" +
                                  "f.readAsDataURL(b);}).catch(function(e){window.WsDl.postMessage('ERR|'+e);});})();"
                              wv.evaluateJavascript(js, null)
                              toast("Preparing " + name + "...")
                          } else if (url.startsWith("data:")) {
                              val comma = url.indexOf(',')
                              val meta = url.substring(5, comma)
                              val data = url.substring(comma + 1)
                              val bytes = if (meta.contains(";base64")) Base64.decode(data, Base64.DEFAULT)
                              else Uri.decode(data).toByteArray(Charsets.UTF_8)
                              saveToDownloads(name, bytes)
                          } else {
                              val req = DownloadManager.Request(Uri.parse(url))
                              req.setMimeType(mime)
                              req.addRequestHeader("Cookie", cookiesFor(url))
                              req.addRequestHeader("User-Agent", ua)
                              req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name)
                              val id = getSystemService(DownloadManager::class.java).enqueue(req)
                              dlUrls[id] = url
                              toast("Downloading $name (see Downloads)")
                          }
                      } catch (e: Exception) {
                          if (url.startsWith("http")) offerBrowser(url) else toast("Download failed")
                      }
                  }
                  return wv
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 100) {
                      val result = WebChromeClient.FileChooserParams.parseResult(resultCode, data)
                      fileCallback?.onReceiveValue(result)
                      fileCallback = null
                  } else {
                      @Suppress("DEPRECATION")
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              private fun showTab() {
                  ensureSite()
                  val key = "$project::$site"
                  var wv = views[key]
                  if (wv == null) {
                      val chat = site == "AI Chat"
                      wv = makeWebView(chat)
                      views[key] = wv
                      container.addView(wv, FrameLayout.LayoutParams(MATCH, MATCH))
                      wv.loadUrl(if (chat) "file:///android_asset/chat.html" else urlOf(site))
                  }
                  if (!keepAlive()) {
                      val dead = views.keys.filter { it != key }
                      for (k in dead) {
                          views.remove(k)?.let { container.removeView(it); it.destroy() }
                      }
                  }
                  for ((k, v) in views) {
                      v.visibility = if (k == key) View.VISIBLE else View.GONE
                  }
                  wv.requestFocus()
                  titleView.text = project
                  refreshStrip()
              }

              private fun startKeepAlive() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  startForegroundService(Intent(this, KeepAliveService::class.java))
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(dlReceiver)
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (inHome) {
                      moveTaskToBack(true)
                      return
                  }
                  val w = current()
                  if (w != null && w.canGoBack()) w.goBack() else showHome()
              }
          }
