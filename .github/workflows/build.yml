name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate the Android project
        run: |
          mkdir -p app/src/main/java/dev/workspace app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "workspace"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          # Fixed signing key so future updates install over this version.
          echo "" | base64 -d > app/ws.keystore

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "dev.workspace"
              compileSdk = 34
              defaultConfig {
                  applicationId = "dev.workspace.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "0.8"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("ws.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:label="Workspace"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Keeps developer web sessions alive in the background" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/dev/workspace/KeepAliveService.kt <<'EOF'
          package dev.workspace

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class KeepAliveService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("keep", "Workspace running", NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, "keep")
                      .setContentTitle("Workspace is running")
                      .setContentText("Your tabs are being kept alive")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
                  return START_STICKY
              }
          }
          EOF

          cat > app/src/main/java/dev/workspace/Chat.kt <<'EOF'
          package dev.workspace

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.SharedPreferences
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.MimeTypeMap
          import android.webkit.WebView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.KeyStore
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          // Keys are encrypted with a key that lives inside the phone's secure keystore.
          object Vault {
              private const val ALIAS = "ws_vault"

              private fun secret(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore")
                  ks.load(null)
                  val existing = ks.getKey(ALIAS, null)
                  if (existing is SecretKey) return existing
                  val kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  kg.init(
                      KeyGenParameterSpec.Builder(
                          ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .build()
                  )
                  return kg.generateKey()
              }

              fun put(prefs: SharedPreferences, name: String, value: String) {
                  val c = Cipher.getInstance("AES/GCM/NoPadding")
                  c.init(Cipher.ENCRYPT_MODE, secret())
                  val enc = c.doFinal(value.toByteArray(Charsets.UTF_8))
                  val packed = Base64.encodeToString(c.iv, Base64.NO_WRAP) + ":" +
                      Base64.encodeToString(enc, Base64.NO_WRAP)
                  prefs.edit().putString("vault_" + name, packed).apply()
              }

              fun get(prefs: SharedPreferences, name: String): String? {
                  val s = prefs.getString("vault_" + name, null) ?: return null
                  return try {
                      val iv = Base64.decode(s.substringBefore(":"), Base64.NO_WRAP)
                      val enc = Base64.decode(s.substringAfter(":"), Base64.NO_WRAP)
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, secret(), GCMParameterSpec(128, iv))
                      String(c.doFinal(enc), Charsets.UTF_8)
                  } catch (e: Exception) {
                      null
                  }
              }

              fun remove(prefs: SharedPreferences, name: String) {
                  prefs.edit().remove("vault_" + name).apply()
              }
          }

          // Connects the chat page (HTML) to the AI providers. Keys never go into the page.
          class ChatBridge(
              private val act: Activity,
              private val wv: WebView,
              private val project: String,
              private val prefs: SharedPreferences,
              private val baseText: () -> String
          ) {
              private class KeyInfo(
                  val id: String, val label: String, val provider: String, val budget: Long,
                  val base: String = "", val model: String = ""
              )

              // code: 0 finished, 1 try next model, 2 stop with error
              private class R(val code: Int, val msg: String = "", val quota: Boolean = false)

              @Volatile private var stopFlag = false
              @Volatile private var conn: HttpURLConnection? = null
              private val modelCache = HashMap<String, List<String>>()
              private var lastTokens = 0
              private var outChars = 0
              private val gem = "https://generativelanguage.googleapis.com/v1beta/"
              private val router = "https://openrouter.ai/api/v1/"

              // ---------- keys, usage, limits ----------

              private fun migrate() {
                  if (prefs.getString("keys_meta", null) != null) return
                  val arr = JSONArray()
                  val old = Vault.get(prefs, "gemini")
                  if (old != null) {
                      Vault.put(prefs, "k1", old)
                      Vault.remove(prefs, "gemini")
                      arr.put(
                          JSONObject().put("id", "k1").put("label", "Gemini 1")
                              .put("provider", "gemini").put("budget", 1000000L)
                      )
                  }
                  prefs.edit().putString("keys_meta", arr.toString()).apply()
              }

              private fun keys(): List<KeyInfo> {
                  migrate()
                  val a = try {
                      JSONArray(prefs.getString("keys_meta", "[]"))
                  } catch (e: Exception) {
                      JSONArray()
                  }
                  val out = ArrayList<KeyInfo>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      out.add(
                          KeyInfo(
                              o.getString("id"), o.optString("label", "Key"),
                              o.optString("provider", "gemini"), o.optLong("budget", 1000000L),
                              o.optString("base", ""), o.optString("model", "")
                          )
                      )
                  }
                  return out
              }

              private fun saveMeta(list: List<KeyInfo>) {
                  val a = JSONArray()
                  for (k in list) {
                      a.put(
                          JSONObject().put("id", k.id).put("label", k.label)
                              .put("provider", k.provider).put("budget", k.budget)
                              .put("base", k.base).put("model", k.model)
                      )
                  }
                  prefs.edit().putString("keys_meta", a.toString()).apply()
              }

              private fun activeId(list: List<KeyInfo>): String? {
                  val a = prefs.getString("key_active", null)
                  if (a != null && list.any { it.id == a }) return a
                  return list.firstOrNull()?.id
              }

              private fun ordered(list: List<KeyInfo>): List<KeyInfo> {
                  val a = activeId(list)
                  val first = list.filter { it.id == a }
                  return first + list.filter { it.id != a }
              }

              private fun today(): String {
                  val f = SimpleDateFormat("yyyy-MM-dd", Locale.US)
                  f.timeZone = TimeZone.getTimeZone("America/Los_Angeles")
                  return f.format(Date())
              }

              private fun usage(id: String): LongArray {
                  val p = (prefs.getString("use_" + id, "") ?: "").split("|")
                  if (p.size == 3 && p[0] == today()) {
                      return longArrayOf(p[1].toLongOrNull() ?: 0L, p[2].toLongOrNull() ?: 0L)
                  }
                  return longArrayOf(0L, 0L)
              }

              private fun addUsage(id: String, tokens: Long) {
                  val u = usage(id)
                  prefs.edit().putString("use_" + id, today() + "|" + (u[0] + tokens) + "|" + (u[1] + 1)).apply()
              }

              private fun exhaustedUntil(id: String): Long = prefs.getLong("ex_" + id, 0L)

              private fun isExhausted(id: String): Boolean = exhaustedUntil(id) > System.currentTimeMillis()

              private fun nextMidnightPacific(): Long {
                  val cal = Calendar.getInstance(TimeZone.getTimeZone("America/Los_Angeles"))
                  cal.add(Calendar.DAY_OF_YEAR, 1)
                  cal.set(Calendar.HOUR_OF_DAY, 0)
                  cal.set(Calendar.MINUTE, 0)
                  cal.set(Calendar.SECOND, 0)
                  cal.set(Calendar.MILLISECOND, 0)
                  return cal.timeInMillis
              }

              private fun markExhausted(id: String, daily: Boolean) {
                  val until = if (daily) nextMidnightPacific() else System.currentTimeMillis() + 90000L
                  prefs.edit().putLong("ex_" + id, until).apply()
              }

              private fun looksDaily(msg: String): Boolean {
                  val s = msg.lowercase()
                  return s.contains("perday") || s.contains("per day") || s.contains("daily") || s.contains("credit")
              }

              // ---------- functions the page can call ----------

              @JavascriptInterface
              fun hasKey(): Boolean = keys().isNotEmpty()

              @JavascriptInterface
              fun keysJson(): String {
                  val list = keys()
                  val act = activeId(list)
                  val arr = JSONArray()
                  for (k in list) {
                      val u = usage(k.id)
                      val left = if (k.budget > 0) Math.max(0L, 100L - (u[0] * 100L / k.budget)) else 100L
                      arr.put(
                          JSONObject().put("id", k.id).put("label", k.label).put("provider", k.provider)
                              .put("budget", k.budget).put("used", u[0]).put("reqs", u[1]).put("pct", left)
                              .put("exhausted", isExhausted(k.id)).put("until", exhaustedUntil(k.id))
                              .put("active", k.id == act)
                      )
                  }
                  return JSONObject().put("keys", arr).put("auto", prefs.getBoolean("autoContinue", false)).toString()
              }

              @JavascriptInterface
              fun addKey(provider: String, label: String, secret: String, base: String, model: String): Boolean {
                  val s = secret.trim()
                  if (s.length < 8 || s.contains(" ")) return false
                  if (provider !in setOf("gemini", "claude", "openrouter", "groq", "mistral", "custom")) return false
                  var b = base.trim()
                  if (provider == "custom") {
                      if (!b.startsWith("https://")) return false
                      if (!b.endsWith("/")) b += "/"
                  } else {
                      b = ""
                  }
                  return try {
                      val list = ArrayList<KeyInfo>(keys())
                      val pname = when (provider) {
                          "gemini" -> "Gemini"
                          "claude" -> "Claude"
                          "openrouter" -> "OpenRouter"
                          "groq" -> "Groq"
                          "mistral" -> "Mistral"
                          else -> "Custom"
                      }
                      val name = if (label.trim().isNotEmpty()) label.trim()
                      else pname + " " + (list.count { it.provider == provider } + 1)
                      val id = "k" + System.currentTimeMillis()
                      Vault.put(prefs, id, s)
                      list.add(KeyInfo(id, name, provider, 1000000L, b, model.trim()))
                      saveMeta(list)
                      if (list.size == 1) prefs.edit().putString("key_active", id).apply()
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              @JavascriptInterface
              fun removeKey(id: String) {
                  val list = keys().filter { it.id != id }
                  saveMeta(list)
                  Vault.remove(prefs, id)
                  prefs.edit().remove("use_" + id).remove("ex_" + id).apply()
              }

              @JavascriptInterface
              fun moveKey(id: String, dir: Int) {
                  val list = ArrayList<KeyInfo>(keys())
                  val i = list.indexOfFirst { it.id == id }
                  val j = i + dir
                  if (i < 0 || j < 0 || j >= list.size) return
                  val t = list[i]
                  list[i] = list[j]
                  list[j] = t
                  saveMeta(list)
              }

              @JavascriptInterface
              fun setBudget(id: String, n: String) {
                  val v = n.trim().toLongOrNull() ?: return
                  if (v <= 0L) return
                  saveMeta(keys().map { if (it.id == id) KeyInfo(it.id, it.label, it.provider, v, it.base, it.model) else it })
              }

              @JavascriptInterface
              fun setActive(id: String) {
                  val list = keys()
                  if (activeId(list) != id) {
                      prefs.edit().putString("key_active", id).putBoolean("handoff_next", true).apply()
                  }
              }

              @JavascriptInterface
              fun setAuto(b: Boolean) {
                  prefs.edit().putBoolean("autoContinue", b).apply()
              }

              @JavascriptInterface
              fun theme(): String = prefs.getString("theme", "dark") ?: "dark"

              @JavascriptInterface
              fun fontScale(): String = (prefs.getString("fontScale", "1.0") ?: "1.0")

              @JavascriptInterface
              fun loadHistory(): String = prefs.getString("hist_" + project, "[]") ?: "[]"

              @JavascriptInterface
              fun saveHistory(json: String) {
                  prefs.edit().putString("hist_" + project, json).apply()
              }

              @JavascriptInterface
              fun copy(t: String) {
                  act.runOnUiThread {
                      val cb = act.getSystemService(ClipboardManager::class.java)
                      cb.setPrimaryClip(ClipData.newPlainText("code", t))
                      Toast.makeText(act, "Copied", Toast.LENGTH_SHORT).show()
                  }
              }

              @JavascriptInterface
              fun saveFile(name: String, data: String, isBase64: Boolean): Boolean {
                  val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_")
                  if (Build.VERSION.SDK_INT < 29) {
                      toast("Saving files needs Android 10 or newer. Use Copy instead.")
                      return false
                  }
                  try {
                      val ext = safe.substringAfterLast('.', "").lowercase()
                      val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "application/octet-stream"
                      val v = ContentValues()
                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, safe)
                      v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      val uri = act.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                      if (uri == null) {
                          toast("Could not save")
                          return false
                      }
                      val bytes = if (isBase64) Base64.decode(data, Base64.DEFAULT) else data.toByteArray(Charsets.UTF_8)
                      act.contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                      toast("Saved in Downloads: " + safe)
                      return true
                  } catch (e: Exception) {
                      toast("Could not save")
                      return false
                  }
              }

              @JavascriptInterface
              fun stop() {
                  stopFlag = true
                  try {
                      conn?.disconnect()
                  } catch (e: Exception) {
                  }
              }

              @JavascriptInterface
              fun send(payload: String) {
                  stopFlag = false
                  Thread {
                      try {
                          runChat(payload)
                      } catch (e: Exception) {
                          if (stopFlag) emit("done") else emit("error", "Something went wrong: " + (e.message ?: "unknown"))
                      }
                  }.start()
              }

              private fun toast(t: String) {
                  act.runOnUiThread { Toast.makeText(act, t, Toast.LENGTH_SHORT).show() }
              }

              private fun emitRaw(ev: JSONObject) {
                  act.runOnUiThread {
                      try {
                          wv.evaluateJavascript("window.onNative(" + JSONObject.quote(ev.toString()) + ")", null)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun emit(type: String, text: String = "", flag: Boolean = false) {
                  emitRaw(JSONObject().put("type", type).put("text", text).put("flag", flag))
              }

              // ---------- prompts ----------

              private fun roleText(role: String): String = when (role) {
                  "prompt" -> "ROLE /prompt: Write or improve prompts for AI tools. Give the final prompt in one code block, then at most two short lines on what you changed."
                  "code" -> "ROLE /code: Build or fix code. Return every file complete and ready to upload, one file per code block, with the filename right above each block, and say where each file goes."
                  "fix" -> "ROLE /fix: The user pastes an error or says what is broken. Say the cause in one or two plain lines, then return corrected, complete files ready to upload, one per code block with its filename."
                  "deploy" -> "ROLE /deploy: Give exact tap-by-tap steps, with no commands and no terminal, to publish this project on GitHub Pages or Cloudflare from an Android tablet browser. Number the steps."
                  "explain" -> "ROLE /explain: Explain the given code or file in simple words. Keep it short and avoid jargon."
                  else -> ""
              }

              private fun buildSystem(role: String, handoff: Boolean, files: List<String>): String {
                  val parts = ArrayList<String>()
                  val b = baseText().trim()
                  if (b.isNotEmpty()) parts.add(b)
                  val extra = (prefs.getString("bp_" + project, "") ?: "").trim()
                  if (extra.isNotEmpty()) parts.add("Extra rules for this project:\n" + extra)
                  val r = roleText(role)
                  if (r.isNotEmpty()) parts.add(r)
                  if (handoff) {
                      var h = "HANDOFF: You are taking over this project mid-way because the previous account reached its limit. " +
                          "Keep following all the rules above, continue exactly where the last message stopped, " +
                          "and do not restart or re-ask things that are already settled.\nProject: " + project
                      if (files.isNotEmpty()) h += "\nFiles created so far: " + files.joinToString(", ")
                      parts.add(h)
                  }
                  return parts.joinToString("\n\n")
              }

              // ---------- main flow ----------

              private fun runChat(payload: String) {
                  val p = JSONObject(payload)
                  val list = keys()
                  if (list.isEmpty()) {
                      emit("error", "Add a key first.")
                      return
                  }
                  if (p.optString("mode", "chat") == "image") {
                      runImage(p.optString("prompt", ""))
                      return
                  }
                  val role = p.optString("role", "")
                  val handoff = p.optBoolean("handoff", false) || prefs.getBoolean("handoff_next", false)
                  prefs.edit().putBoolean("handoff_next", false).apply()

                  val turns = ArrayList<Pair<String, String>>()
                  val ms = p.getJSONArray("messages")
                  for (i in 0 until ms.length()) {
                      val m = ms.getJSONObject(i)
                      turns.add(Pair(if (m.getString("role") == "user") "user" else "model", m.getString("text")))
                  }
                  val files = ArrayList<String>()
                  val fa = p.optJSONArray("files")
                  if (fa != null) for (i in 0 until fa.length()) files.add(fa.getString(i))

                  val auto = prefs.getBoolean("autoContinue", false)
                  val order = ordered(list).filter { !isExhausted(it.id) }
                  if (order.isEmpty()) {
                      emit("error", "All your keys are at their limit right now. Try later or add another key.")
                      return
                  }
                  var useHandoff = handoff
                  for ((idx, k) in order.withIndex()) {
                      if (stopFlag) {
                          emit("done")
                          return
                      }
                      if (idx > 0) {
                          useHandoff = true
                          emit("switched", k.label)
                      }
                      prefs.edit().putString("key_active", k.id).apply()
                      val res = tryKey(k, role, turns, useHandoff, files, idx > 0)
                      if (res != 1) return
                      // This key hit its limit.
                      val next = order.getOrNull(idx + 1)
                      if (next == null) {
                          emit("error", k.label + " hit its limit and there is no backup key left. Add another key in Keys.")
                          return
                      }
                      if (!auto) {
                          emitRaw(
                              JSONObject().put("type", "limit").put("text", k.label)
                                  .put("nextId", next.id).put("nextLabel", next.label)
                          )
                          return
                      }
                  }
              }

              // 0 = finished (done or error already sent), 1 = key hit its limit, 2 = error already sent
              private fun tryKey(
                  k: KeyInfo, role: String, turns: List<Pair<String, String>>,
                  handoff: Boolean, files: List<String>, backup: Boolean
              ): Int {
                  val secret = Vault.get(prefs, k.id)
                  if (secret == null) {
                      emit("error", k.label + ": the key could not be read. Remove it and add it again.")
                      return 2
                  }
                  val system = buildSystem(role, handoff, files)
                  val cands = try {
                      candidatesFor(k, secret)
                  } catch (e: Exception) {
                      emit("error", k.label + ": " + (e.message ?: "could not connect"))
                      return 2
                  }
                  var sawQuota = false
                  var daily = false
                  var lastErr = ""
                  for ((i, m) in cands.withIndex()) {
                      if (stopFlag) {
                          emit("done")
                          return 0
                      }
                      emit("model", k.label + " \u00B7 " + m.removePrefix("models/"), backup || i > 0)
                      lastTokens = 0
                      outChars = 0
                      val r = when (k.provider) {
                          "gemini" -> streamGemini(secret, m, system, turns)
                          "claude" -> streamClaude(secret, m, system, turns)
                          else -> streamRouter(k, secret, m, system, turns)
                      }
                      if (r.code == 0) {
                          var chars = system.length
                          for (t in turns) chars += t.second.length
                          val tokens = if (lastTokens > 0) lastTokens.toLong() else ((chars + outChars) / 4).toLong()
                          addUsage(k.id, tokens)
                          return 0
                      }
                      if (r.code == 2) {
                          emit("error", k.label + ": " + r.msg)
                          return 2
                      }
                      lastErr = r.msg
                      if (r.quota) {
                          sawQuota = true
                          if (looksDaily(r.msg)) daily = true
                      }
                  }
                  if (sawQuota) {
                      markExhausted(k.id, daily)
                      return 1
                  }
                  emit("error", "Every model on " + k.label + " failed. Last message: " + lastErr)
                  return 2
              }

              // ---------- model lists ----------

              private fun errMsg(txt: String, code: Int): String {
                  return try {
                      JSONObject(txt).getJSONObject("error").getString("message")
                  } catch (e: Exception) {
                      "HTTP " + code
                  }
              }

              private fun geminiList(secret: String): JSONArray {
                  val c = URL(gem + "models?pageSize=200").openConnection() as HttpURLConnection
                  c.setRequestProperty("x-goog-api-key", secret)
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  val code = c.responseCode
                  if (code != 200) {
                      throw Exception("Google refused the key (code " + code + "). Check the key or make a new one.")
                  }
                  val txt = c.inputStream.bufferedReader().use { it.readText() }
                  return JSONObject(txt).optJSONArray("models") ?: JSONArray()
              }

              private fun canGenerate(o: JSONObject): Boolean {
                  val methods = o.optJSONArray("supportedGenerationMethods") ?: return false
                  for (j in 0 until methods.length()) {
                      if (methods.getString(j) == "generateContent") return true
                  }
                  return false
              }

              private fun ver(n: String): Double =
                  Regex("gemini-(\\d+(?:\\.\\d+)?)").find(n)?.groupValues?.get(1)?.toDoubleOrNull() ?: 0.0

              private fun baseOf(k: KeyInfo): String = when (k.provider) {
                  "openrouter" -> router
                  "groq" -> "https://api.groq.com/openai/v1/"
                  "mistral" -> "https://api.mistral.ai/v1/"
                  else -> k.base
              }

              private fun candidatesFor(k: KeyInfo, secret: String): List<String> {
                  val ck = "chat:" + k.id
                  modelCache[ck]?.let { return it }
                  val result: List<String>
                  if (k.provider == "gemini") {
                      val arr = geminiList(secret)
                      val bad = listOf(
                          "image", "tts", "audio", "live", "embedding", "robotics",
                          "computer", "vision", "learnlm", "gemma", "exp", "thinking"
                      )
                      val found = ArrayList<String>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val name = o.optString("name")
                          if (!canGenerate(o)) continue
                          if (!name.contains("gemini") || !name.contains("flash")) continue
                          if (bad.any { name.contains(it) }) continue
                          found.add(name)
                      }
                      val sorted = found.sortedWith(
                          compareBy<String>(
                              { it.contains("preview") },
                              { -ver(it) },
                              { it.contains("lite") },
                              { it.length }
                          )
                      ).take(4)
                      result = if (sorted.isEmpty()) listOf("models/gemini-flash-latest") else sorted
                  } else if (k.model.isNotEmpty()) {
                      result = listOf(k.model)
                  } else if (k.provider == "claude") {
                      val c = URL("https://api.anthropic.com/v1/models?limit=100").openConnection() as HttpURLConnection
                      c.setRequestProperty("x-api-key", secret)
                      c.setRequestProperty("anthropic-version", "2023-06-01")
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      val code = c.responseCode
                      if (code != 200) {
                          throw Exception("Anthropic refused the key (code " + code + "). Check the key and that it has credit.")
                      }
                      val txt = c.inputStream.bufferedReader().use { it.readText() }
                      val arr = JSONObject(txt).optJSONArray("data") ?: JSONArray()
                      val ids = ArrayList<String>()
                      val made = ArrayList<String>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val id = o.optString("id")
                          if (id.isEmpty()) continue
                          ids.add(id)
                          made.add(o.optString("created_at", ""))
                      }
                      if (ids.isEmpty()) throw Exception("No Claude models found for this key.")
                      fun fam(n: String): Int = if (n.contains("sonnet")) 0 else if (n.contains("haiku")) 1 else 2
                      val sorted = ids.indices.sortedWith(Comparator { a, b ->
                          val fa = fam(ids[a])
                          val fb = fam(ids[b])
                          if (fa != fb) fa - fb else made[b].compareTo(made[a])
                      })
                      result = sorted.take(3).map { ids[it] }
                  } else if (k.provider == "openrouter") {
                      val c = URL(router + "models").openConnection() as HttpURLConnection
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      val code = c.responseCode
                      if (code != 200) throw Exception("Could not load the OpenRouter model list (code " + code + ").")
                      val txt = c.inputStream.bufferedReader().use { it.readText() }
                      val arr = JSONObject(txt).optJSONArray("data") ?: JSONArray()
                      val ids = ArrayList<String>()
                      val ctxs = ArrayList<Int>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val id = o.optString("id")
                          val pr = o.optJSONObject("pricing") ?: continue
                          val a = pr.optString("prompt", "1").toDoubleOrNull() ?: 1.0
                          val b = pr.optString("completion", "1").toDoubleOrNull() ?: 1.0
                          if (a != 0.0 || b != 0.0) continue
                          if (!id.endsWith(":free")) continue
                          ids.add(id)
                          ctxs.add(o.optInt("context_length", 0))
                      }
                      if (ids.isEmpty()) throw Exception("No free OpenRouter models found right now.")
                      val idx = ids.indices.sortedByDescending { ctxs[it] }.take(4)
                      result = idx.map { ids[it] }
                  } else {
                      val c = URL(baseOf(k) + "models").openConnection() as HttpURLConnection
                      c.setRequestProperty("Authorization", "Bearer " + secret)
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      val code = c.responseCode
                      if (code != 200) {
                          throw Exception("Could not load the model list (code " + code + "). Check the key and web address, or type a model name when adding the key.")
                      }
                      val txt = c.inputStream.bufferedReader().use { it.readText() }
                      val arr = JSONObject(txt).optJSONArray("data") ?: JSONArray()
                      val bad = listOf(
                          "whisper", "guard", "tts", "embed", "moderation", "ocr", "rerank",
                          "image", "audio", "speech", "orpheus", "playai", "transcribe"
                      )
                      val ids = ArrayList<String>()
                      val created = ArrayList<Long>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val id = o.optString("id")
                          if (id.isEmpty() || bad.any { id.lowercase().contains(it) }) continue
                          ids.add(id)
                          created.add(o.optLong("created", 0L))
                      }
                      if (ids.isEmpty()) throw Exception("No chat models found. Type a model name when adding the key.")
                      result = ids.indices.sortedByDescending { created[it] }.take(4).map { ids[it] }
                  }
                  modelCache[ck] = result
                  return result
              }

              // ---------- streaming: Gemini ----------

              private fun streamGemini(secret: String, model: String, system: String, turns: List<Pair<String, String>>): R {
                  val contents = JSONArray()
                  for (t in turns) {
                      contents.put(
                          JSONObject().put("role", t.first).put(
                              "parts", JSONArray().put(JSONObject().put("text", t.second))
                          )
                      )
                  }
                  val body = JSONObject()
                      .put(
                          "system_instruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", system)))
                      )
                      .put("contents", contents)

                  val c = URL(gem + model + ":streamGenerateContent?alt=sse").openConnection() as HttpURLConnection
                  conn = c
                  c.requestMethod = "POST"
                  c.doOutput = true
                  c.connectTimeout = 20000
                  c.readTimeout = 120000
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("x-goog-api-key", secret)
                  var got = false
                  var blocked = false
                  try {
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      if (code != 200) {
                          val err = try {
                              c.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                          } catch (e: Exception) {
                              ""
                          }
                          val retry = code == 403 || code == 404 || code == 429 || code >= 500
                          return R(if (retry) 1 else 2, errMsg(err, code), code == 429)
                      }
                      c.inputStream.bufferedReader().use { r ->
                          while (true) {
                              if (stopFlag) break
                              val line = r.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val js = line.substring(5).trim()
                              if (js.isEmpty()) continue
                              val o = JSONObject(js)
                              val um = o.optJSONObject("usageMetadata")
                              if (um != null) {
                                  val tt = um.optInt("totalTokenCount", 0)
                                  if (tt > 0) lastTokens = tt
                              }
                              val cands = o.optJSONArray("candidates")
                              if (cands == null || cands.length() == 0) {
                                  if (o.has("promptFeedback") && !got) {
                                      blocked = true
                                      break
                                  }
                                  continue
                              }
                              val parts = cands.getJSONObject(0).optJSONObject("content")?.optJSONArray("parts")
                              if (parts != null) {
                                  for (j in 0 until parts.length()) {
                                      val pt = parts.getJSONObject(j)
                                      if (pt.optBoolean("thought", false)) continue
                                      if (pt.isNull("text")) continue
                                      val t = pt.optString("text", "")
                                      if (t.isNotEmpty()) {
                                          got = true
                                          outChars += t.length
                                          emit("chunk", t)
                                      }
                                  }
                              }
                          }
                      }
                      if (blocked) {
                          emit("error", "Google's safety filter blocked this message.")
                          return R(0)
                      }
                      emit("done")
                      return R(0)
                  } catch (e: Exception) {
                      if (stopFlag) {
                          emit("done")
                          return R(0)
                      }
                      if (got) {
                          emit("error", "The connection dropped: " + (e.message ?: "unknown"))
                          return R(0)
                      }
                      return R(1, e.message ?: "network problem")
                  } finally {
                      conn = null
                  }
              }

              // ---------- streaming: Claude (Anthropic) ----------

              private fun streamClaude(secret: String, model: String, system: String, turns: List<Pair<String, String>>): R {
                  val messages = JSONArray()
                  for (t in turns) {
                      messages.put(
                          JSONObject().put("role", if (t.first == "user") "user" else "assistant").put("content", t.second)
                      )
                  }
                  val body = JSONObject()
                      .put("model", model)
                      .put("max_tokens", 8000)
                      .put("system", system)
                      .put("messages", messages)
                      .put("stream", true)

                  val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  conn = c
                  c.requestMethod = "POST"
                  c.doOutput = true
                  c.connectTimeout = 20000
                  c.readTimeout = 120000
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("x-api-key", secret)
                  c.setRequestProperty("anthropic-version", "2023-06-01")
                  var got = false
                  var inTok = 0
                  var outTok = 0
                  var streamErr = ""
                  try {
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      if (code != 200) {
                          val err = try {
                              c.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                          } catch (e: Exception) {
                              ""
                          }
                          val msg = errMsg(err, code)
                          val credit = msg.lowercase().contains("credit")
                          val retry = credit || code == 403 || code == 404 || code == 429 || code == 529 || code >= 500
                          return R(if (retry) 1 else 2, msg, code == 429 || credit)
                      }
                      c.inputStream.bufferedReader().use { r ->
                          while (true) {
                              if (stopFlag) break
                              val line = r.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val js = line.substring(5).trim()
                              if (js.isEmpty()) continue
                              val o = JSONObject(js)
                              val type = o.optString("type", "")
                              if (type == "content_block_delta") {
                                  val d = o.optJSONObject("delta")
                                  if (d != null && d.optString("type", "") == "text_delta" && !d.isNull("text")) {
                                      val t = d.optString("text", "")
                                      if (t.isNotEmpty()) {
                                          got = true
                                          outChars += t.length
                                          emit("chunk", t)
                                      }
                                  }
                              } else if (type == "message_start") {
                                  inTok = o.optJSONObject("message")?.optJSONObject("usage")?.optInt("input_tokens", 0) ?: 0
                              } else if (type == "message_delta") {
                                  val ot = o.optJSONObject("usage")?.optInt("output_tokens", 0) ?: 0
                                  if (ot > 0) outTok = ot
                              } else if (type == "error") {
                                  streamErr = o.optJSONObject("error")?.optString("message", "error") ?: "error"
                                  break
                              } else if (type == "message_stop") {
                                  break
                              }
                          }
                      }
                      if (inTok + outTok > 0) lastTokens = inTok + outTok
                      if (streamErr.isNotEmpty()) {
                          if (!got) return R(1, streamErr)
                          emit("error", "The connection dropped: " + streamErr)
                          return R(0)
                      }
                      emit("done")
                      return R(0)
                  } catch (e: Exception) {
                      if (stopFlag) {
                          emit("done")
                          return R(0)
                      }
                      if (got) {
                          emit("error", "The connection dropped: " + (e.message ?: "unknown"))
                          return R(0)
                      }
                      return R(1, e.message ?: "network problem")
                  } finally {
                      conn = null
                  }
              }

              // ---------- streaming: OpenRouter ----------

              private fun streamRouter(k: KeyInfo, secret: String, model: String, system: String, turns: List<Pair<String, String>>): R {
                  val messages = JSONArray()
                  messages.put(JSONObject().put("role", "system").put("content", system))
                  for (t in turns) {
                      messages.put(
                          JSONObject().put("role", if (t.first == "user") "user" else "assistant").put("content", t.second)
                      )
                  }
                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", messages)
                      .put("stream", true)
                  if (k.provider == "openrouter") body.put("stream_options", JSONObject().put("include_usage", true))

                  val c = URL(baseOf(k) + "chat/completions").openConnection() as HttpURLConnection
                  conn = c
                  c.requestMethod = "POST"
                  c.doOutput = true
                  c.connectTimeout = 20000
                  c.readTimeout = 120000
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("Authorization", "Bearer " + secret)
                  var got = false
                  try {
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      if (code != 200) {
                          val err = try {
                              c.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                          } catch (e: Exception) {
                              ""
                          }
                          val retry = code == 402 || code == 403 || code == 404 || code == 408 || code == 429 || code >= 500
                          return R(if (retry) 1 else 2, errMsg(err, code), code == 429 || code == 402)
                      }
                      c.inputStream.bufferedReader().use { r ->
                          while (true) {
                              if (stopFlag) break
                              val line = r.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val js = line.substring(5).trim()
                              if (js.isEmpty()) continue
                              if (js == "[DONE]") break
                              val o = JSONObject(js)
                              val us = o.optJSONObject("usage")
                              if (us != null) {
                                  val tt = us.optInt("total_tokens", 0)
                                  if (tt > 0) lastTokens = tt
                              }
                              val ch = o.optJSONArray("choices")
                              if (ch != null && ch.length() > 0) {
                                  val d = ch.getJSONObject(0).optJSONObject("delta")
                                  if (d != null && !d.isNull("content")) {
                                      val t = d.optString("content", "")
                                      if (t.isNotEmpty()) {
                                          got = true
                                          outChars += t.length
                                          emit("chunk", t)
                                      }
                                  }
                              }
                          }
                      }
                      emit("done")
                      return R(0)
                  } catch (e: Exception) {
                      if (stopFlag) {
                          emit("done")
                          return R(0)
                      }
                      if (got) {
                          emit("error", "The connection dropped: " + (e.message ?: "unknown"))
                          return R(0)
                      }
                      return R(1, e.message ?: "network problem")
                  } finally {
                      conn = null
                  }
              }

              // ---------- images (Gemini only for now) ----------

              private fun imageModels(k: KeyInfo, secret: String): List<String> {
                  val ck = "img:" + k.id
                  modelCache[ck]?.let { return it }
                  val arr = geminiList(secret)
                  val found = ArrayList<String>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val name = o.optString("name")
                      if (!canGenerate(o)) continue
                      if (!name.contains("gemini") || !name.contains("image") || name.contains("imagen")) continue
                      found.add(name)
                  }
                  val sorted = found.sortedWith(compareBy<String>({ it.contains("preview") }, { -ver(it) })).take(3)
                  modelCache[ck] = sorted
                  return sorted
              }

              private fun runImage(prompt: String) {
                  val gems = ordered(keys()).filter { it.provider == "gemini" && !isExhausted(it.id) }
                  if (gems.isEmpty()) {
                      emit("error", "Images need a Gemini key that is not at its limit.")
                      return
                  }
                  var last = ""
                  for (k in gems) {
                      val secret = Vault.get(prefs, k.id) ?: continue
                      val models = try {
                          imageModels(k, secret)
                      } catch (e: Exception) {
                          last = e.message ?: ""
                          continue
                      }
                      if (models.isEmpty()) {
                          last = "No image model is available for this key."
                          continue
                      }
                      for (m in models) {
                          if (stopFlag) {
                              emit("done")
                              return
                          }
                          emit("model", k.label + " \u00B7 " + m.removePrefix("models/"), false)
                          try {
                              val body = JSONObject()
                                  .put(
                                      "contents",
                                      JSONArray().put(
                                          JSONObject().put("role", "user").put(
                                              "parts", JSONArray().put(JSONObject().put("text", prompt))
                                          )
                                      )
                                  )
                                  .put(
                                      "generationConfig",
                                      JSONObject().put("responseModalities", JSONArray().put("TEXT").put("IMAGE"))
                                  )
                              val c = URL(gem + m + ":generateContent").openConnection() as HttpURLConnection
                              conn = c
                              c.requestMethod = "POST"
                              c.doOutput = true
                              c.connectTimeout = 20000
                              c.readTimeout = 120000
                              c.setRequestProperty("Content-Type", "application/json")
                              c.setRequestProperty("x-goog-api-key", secret)
                              c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                              val code = c.responseCode
                              val txt = (if (code == 200) c.inputStream else c.errorStream)
                                  ?.bufferedReader()?.use { it.readText() } ?: ""
                              if (code != 200) {
                                  last = errMsg(txt, code)
                                  if (code == 429) markExhausted(k.id, looksDaily(last))
                                  continue
                              }
                              val parts = JSONObject(txt).optJSONArray("candidates")
                                  ?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                              var data = ""
                              var mime = "image/png"
                              var text = ""
                              if (parts != null) {
                                  for (j in 0 until parts.length()) {
                                      val pt = parts.getJSONObject(j)
                                      val inl = pt.optJSONObject("inlineData") ?: pt.optJSONObject("inline_data")
                                      if (inl != null && !inl.isNull("data")) {
                                          data = inl.optString("data", "")
                                          mime = inl.optString("mimeType", inl.optString("mime_type", "image/png"))
                                      } else if (!pt.isNull("text")) {
                                          text += pt.optString("text", "")
                                      }
                                  }
                              }
                              if (data.isNotEmpty()) {
                                  addUsage(k.id, 1300L)
                                  emitRaw(
                                      JSONObject().put("type", "image").put("mime", mime)
                                          .put("data", data).put("text", text)
                                  )
                                  return
                              }
                              last = "The model returned no image."
                          } catch (e: Exception) {
                              if (stopFlag) {
                                  emit("done")
                                  return
                              }
                              last = e.message ?: "network problem"
                          } finally {
                              conn = null
                          }
                      }
                  }
                  emit("error", "Could not make an image. " + last)
              }
          }
