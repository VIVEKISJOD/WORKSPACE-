          .u{background:var(--ubg);margin-left:16%}
          .a{background:var(--card);border:1px solid var(--line)}
          .err{background:#2a1215;border:1px solid #7f1d1d;color:#fecaca}
          html.light .err{background:#fee2e2;border-color:#fca5a5;color:#7f1d1d}
          .hint{color:var(--sub);text-align:center;margin-top:40px;white-space:pre-wrap}
          .m code{background:var(--cbg);border-radius:4px;padding:1px 5px;font:.85em ui-monospace,monospace}
          .m img{max-width:100%;border-radius:10px;display:block;margin-bottom:8px}
          .code{margin:8px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--cbg);white-space:normal}
          .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);gap:6px}
          .ch .bs{display:flex;gap:6px}
          .ch button{padding:4px 10px;font-size:12px;border-radius:8px}
          .code pre{margin:0;padding:10px 12px;overflow-x:auto;font:.82rem/1.45 ui-monospace,monospace;white-space:pre}
          #banner{padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem;background:var(--card)}
          #banner .bb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
          #status{padding:0 14px;height:18px;font-size:12px;color:var(--sub)}
          #cmds{display:flex;gap:6px;padding:4px 10px;overflow-x:auto}
          #cmds button{padding:5px 11px;font-size:13px;white-space:nowrap;border-radius:999px;color:var(--sub)}
          #bar{display:flex;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line);align-items:flex-end}
          #ta{flex:1;resize:none;max-height:130px;padding:10px 12px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit}
          #go{padding:10px 16px}
          </style>
          </head>
          <body>
          <div id="app">
            <div id="top">
              <span class="tag on">Base prompt active</span>
              <span class="tag" id="tModel">no model yet</span>
              <button class="tag" id="tMeter">no key</button>
              <span class="sp"></span>
              <button id="bClear">Clear</button>
              <button id="bKeys">Keys</button>
            </div>

            <div id="keys" hidden>
              <h2>Keys</h2>
              <p>Your AI accounts, in backup order. The first one in use is tried first.</p>
              <div id="klist"></div>
              <label><input type="checkbox" id="auto"> Switch to the next key automatically when a limit hits</label>
              <div class="note">Percent left is an estimate. Providers do not tell apps how much free quota is left, so the app counts what you used today and compares it with the budget you set for each key. Keys are stored encrypted on this device and never uploaded.</div>
              <h3>Add a key</h3>
              <select id="kp"><option value="gemini">Gemini (aistudio.google.com)</option><option value="claude">Claude API (console.anthropic.com, paid credit)</option><option value="openrouter">OpenRouter (openrouter.ai, free models)</option><option value="groq">Groq (console.groq.com)</option><option value="mistral">Mistral (console.mistral.ai)</option><option value="custom">Custom (any OpenAI-style service)</option></select>
              <input id="kl" placeholder="Name, for example Gemini 1 (optional)" autocomplete="off">
              <input id="kb" placeholder="Web address, like https://api.example.com/v1" autocomplete="off" autocapitalize="off" hidden>
              <input id="km" placeholder="Model name (optional, leave empty to pick automatically)" autocomplete="off" autocapitalize="off">
              <input id="kin" type="password" placeholder="Paste key here" autocomplete="off" autocapitalize="off" spellcheck="false">
              <button class="pri" id="kAdd">Add key</button>
              <div class="note" id="kMsg"></div>
              <button id="kClose" style="margin-top:14px">Close</button>
            </div>

            <div id="msgs"></div>
            <div id="banner" hidden></div>
            <div id="status"></div>
            <div id="cmds"></div>
            <div id="bar">
              <textarea id="ta" rows="1" placeholder="Message, or tap a command"></textarea>
              <button class="pri" id="go">Send</button>
            </div>
          </div>

          <script>
          var N = window.Native;
          var msgs = [], busy = false, cur = null, curEl = null, lastRole = '', KS = {keys: [], auto: false}, nearDone = {};
          function $(i){ return document.getElementById(i); }
          function mk(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
          function btn(text, fn, cls){ var b = mk('button', cls || '', text); b.onclick = fn; return b; }

          /* ---------- text and code rendering ---------- */
          function detectName(s){
            s = (s || '').trim().replace(/^[#>*\-\s`]+/, '').replace(/[*`:\s]+$/, '').replace(/^(file|filename)\s*:\s*/i, '');
            if(/^[\w.\-\/]+\.[A-Za-z0-9]{1,8}$/.test(s)) return s.split('/').pop();
            return '';
          }
          function lastLine(pre){
            var ls = pre.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
            return ls.length ? ls[ls.length - 1] : '';
          }
          function parse(text){
            var out = [], re = /```([^\n`]*)\n?([\s\S]*?)(```|$)/g, last = 0, m;
            while((m = re.exec(text)) !== null){
              var pre = text.slice(last, m.index);
              if(pre) out.push({k: 't', s: pre});
              var lang = m[1].trim();
              out.push({k: 'c', lang: lang, name: detectName(lang) || detectName(lastLine(pre)), s: m[2]});
              last = re.lastIndex;
            }
            if(last < text.length) out.push({k: 't', s: text.slice(last)});
            return out;
          }
          function inline(parent, s){
            s.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach(function(p){
              if(!p) return;
              if(p.charAt(0) === '`' && p.length > 2){ parent.appendChild(mk('code', '', p.slice(1, -1))); }
              else if(p.slice(0, 2) === '**' && p.length > 4){ parent.appendChild(mk('b', '', p.slice(2, -2))); }
              else parent.appendChild(document.createTextNode(p));
            });
          }
          function block(parent, seg){
            var code = seg.s.replace(/\n$/, '');
            var box = mk('div', 'code'), head = mk('div', 'ch'), bs = mk('div', 'bs');
            head.appendChild(mk('span', '', seg.name || seg.lang || 'code'));
            if(seg.name) bs.appendChild(btn('Save', function(){ N.saveFile(seg.name, code, false); }));
            bs.appendChild(btn('Copy', function(){ N.copy(code); }));
            head.appendChild(bs);
            box.appendChild(head); box.appendChild(mk('pre', '', code));
            parent.appendChild(box);
          }
          function fill(el, m){
            el.textContent = '';
            if(m.img){
              var im = mk('img'); im.src = m.img; el.appendChild(im);
              var ext = m.img.indexOf('image/jpeg') > -1 ? 'jpg' : 'png';
              var b = btn('Save image', function(){ N.saveFile('image-' + Date.now() + '.' + ext, m.img.split(',')[1], true); });
              b.style.marginBottom = '8px'; el.appendChild(b);
            }
            parse(m.t || '').forEach(function(seg){
              if(seg.k === 't') inline(el, seg.s); else block(el, seg);
            });
          }
          function scrollDown(){ var s = $('msgs'); s.scrollTop = s.scrollHeight; }
          function addMsg(m){
            var d = mk('div', 'm ' + (m.r === 'user' ? 'u' : 'a'));
            fill(d, m); $('msgs').appendChild(d); return d;
          }
          function showErr(t){ $('msgs').appendChild(mk('div', 'm err', t)); scrollDown(); }
          function hintIfEmpty(){
            var old = $('hint'); if(old) old.remove();
            if(msgs.length === 0){
              var h = mk('div', 'hint', 'Ask me to build something.\nTap a command below to start.'); h.id = 'hint';
              $('msgs').appendChild(h);
            }
          }
          function setStatus(t){ $('status').textContent = t; }
          function listFiles(){
            var seen = {}, out = [];
            msgs.forEach(function(m){
              if(m.r !== 'model' || m.local) return;
              parse(m.t || '').forEach(function(s){ if(s.k === 'c' && s.name && !seen[s.name]){ seen[s.name] = 1; out.push(s.name); } });
            });
            return out.slice(-40);
          }
          function save(){
            try{
              var keep = msgs.slice(-200).map(function(m){
                if(m.img) return {r: m.r, t: (m.t || '') + '\n[image not saved]', local: true};
                return m;
              });
              N.saveHistory(JSON.stringify(keep));
            }catch(e){}
          }

          /* ---------- banner ---------- */
          function clearBanner(){ $('banner').hidden = true; $('banner').textContent = ''; }
          function banner(text, buttons){
            var b = $('banner'); b.textContent = ''; b.hidden = false;
            b.appendChild(mk('div', '', text));
            var row = mk('div', 'bb');
            buttons.forEach(function(x){ row.appendChild(btn(x[0], x[1], x[2] || '')); });
            b.appendChild(row);
          }

          /* ---------- keys and meter ---------- */
          function loadKeys(){ try{ KS = JSON.parse(N.keysJson()); }catch(e){} }
          function activeKey(){ for(var i = 0; i < KS.keys.length; i++) if(KS.keys[i].active) return KS.keys[i]; return null; }
          function pname(p){ return {gemini: 'Gemini', claude: 'Claude', openrouter: 'OpenRouter', groq: 'Groq', mistral: 'Mistral', custom: 'Custom'}[p] || p; }
          function fmt(n){ return n >= 1000000 ? (n / 1000000).toFixed(1) + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n); }
          function updateMeter(){
            loadKeys();
            var a = activeKey(), t = $('tMeter');
            if(!a){ t.textContent = 'no key'; t.className = 'tag warn'; return; }
            t.textContent = a.label + ' \u00B7 ' + (a.exhausted ? 'limit reached' : a.pct + '% left (est.)');
            t.className = 'tag' + ((a.exhausted || a.pct <= 15) ? ' warn' : ' on');
          }
          function showKeys(on){
            if(!on && !N.hasKey()) on = true;
            $('keys').hidden = !on;
            ['msgs', 'cmds', 'bar', 'status'].forEach(function(i){ $(i).hidden = on; });
            if(on){ clearBanner(); renderKeys(); }
            $('kClose').hidden = !N.hasKey();
            updateMeter();
          }
          function renderKeys(){
            loadKeys();
            var box = $('klist'); box.textContent = '';
            $('auto').checked = !!KS.auto;
            KS.keys.forEach(function(k, i){
              var c = mk('div', 'kcard'), h = mk('div', 'kh');
              h.appendChild(mk('span', '', k.label + ' \u00B7 ' + pname(k.provider)));
              if(k.active) h.appendChild(mk('span', 'tag on', 'In use'));
              c.appendChild(h);
              var bar = mk('div', 'bar'), f = mk('div', 'fill' + (k.pct <= 15 ? ' low' : ''));
              f.style.width = k.pct + '%'; bar.appendChild(f); c.appendChild(bar);
              c.appendChild(mk('div', 'kinfo', k.exhausted
                ? 'Limit reached. Tries again ' + new Date(k.until).toLocaleString()
                : k.pct + '% left (estimated) \u00B7 ' + fmt(k.used) + ' of ' + fmt(k.budget) + ' tokens today \u00B7 ' + k.reqs + ' requests'));
              var row = mk('div', 'krow');
              if(!k.active) row.appendChild(btn('Use', function(){ N.setActive(k.id); renderKeys(); updateMeter(); }));
              if(i > 0) row.appendChild(btn('Up', function(){ N.moveKey(k.id, -1); renderKeys(); }));
              if(i < KS.keys.length - 1) row.appendChild(btn('Down', function(){ N.moveKey(k.id, 1); renderKeys(); }));
              var bf = mk('div', 'bf'); bf.hidden = true;
              var inp = mk('input'); inp.type = 'number'; inp.value = k.budget; inp.placeholder = 'Tokens per day';
              bf.appendChild(inp);
              bf.appendChild(btn('Save', function(){ N.setBudget(k.id, String(inp.value)); renderKeys(); updateMeter(); }, 'pri'));
              row.appendChild(btn('Budget', function(){ bf.hidden = !bf.hidden; }));
              var rm = btn('Remove', function(){}); armed(rm, 'Remove', function(){ N.removeKey(k.id); renderKeys(); updateMeter(); if(!N.hasKey()) showKeys(true); });
              row.appendChild(rm);
              c.appendChild(row); c.appendChild(bf);
              box.appendChild(c);
            });
          }
          function armed(b, label, fn){
            var on = false, t;
            b.onclick = function(){
              if(!on){ on = true; b.textContent = 'Tap again'; t = setTimeout(function(){ on = false; b.textContent = label; }, 3000); }
              else { clearTimeout(t); on = false; b.textContent = label; fn(); }
            };
          }
          function checkNear(){
            loadKeys();
            var a = activeKey();
            if(!a || a.exhausted || a.pct > 15 || nearDone[a.id]) return;
            var nx = null;
            KS.keys.forEach(function(k){ if(!nx && k.id !== a.id && !k.exhausted) nx = k; });
            nearDone[a.id] = 1;
            var used = 100 - a.pct;
            if(nx){
              banner(a.label + ' is about ' + used + '% used (estimate). Switch to ' + nx.label + '? Your next message will carry on with a handoff so nothing is lost.', [
                ['Switch to ' + nx.label, function(){ N.setActive(nx.id); updateMeter(); clearBanner(); setStatus('Switched to ' + nx.label); }, 'pri'],
                ['Not now', clearBanner]
              ]);
            } else {
              banner(a.label + ' is about ' + used + '% used (estimate). Add a backup key so the app can switch for you.', [
                ['Add a key', function(){ showKeys(true); }, 'pri'], ['Not now', clearBanner]
              ]);
            }
          }

          /* ---------- native events ---------- */
          function dropEmpty(){
            if(cur && !cur.t && !cur.img){
              var i = msgs.indexOf(cur); if(i >= 0) msgs.splice(i, 1);
              if(curEl) curEl.remove();
            }
          }
          function setBusy(b){ busy = b; $('go').textContent = b ? 'Stop' : 'Send'; }
          function finish(){ setBusy(false); setStatus(''); cur = null; curEl = null; save(); updateMeter(); }

          window.onNative = function(s){
            var e = JSON.parse(s);
            if(e.type === 'model'){
              $('tModel').textContent = e.text + (e.flag ? ' (backup)' : '');
              $('tModel').className = 'tag' + (e.flag ? ' bk' : '');
              setStatus('Thinking...');
            } else if(e.type === 'switched'){
              setStatus('Switched to ' + e.text + '. Continuing...'); updateMeter();
            } else if(e.type === 'chunk'){
              if(!cur) return;
              cur.t += e.text; fill(curEl, cur); setStatus('Writing...'); scrollDown();
            } else if(e.type === 'image'){
              if(!cur) return;
              cur.img = 'data:' + e.mime + ';base64,' + e.data; cur.t = e.text || '';
              fill(curEl, cur); scrollDown(); finish();
            } else if(e.type === 'done'){
              finish(); checkNear();
            } else if(e.type === 'limit'){
              dropEmpty(); finish();
              banner(e.text + ' hit its limit. Continue on ' + e.nextLabel + '? The new account gets your project name, the files so far and the recent messages, so nothing is lost.', [
                ['Continue on ' + e.nextLabel, function(){ N.setActive(e.nextId); clearBanner(); startRun(lastRole, true); }, 'pri'],
                ['Cancel', clearBanner]
              ]);
            } else if(e.type === 'error'){
              dropEmpty(); showErr(e.text); finish();
            }
          };

          /* ---------- sending ---------- */
          function startRun(role, handoff){
            lastRole = role;
            var arr = [];
            msgs.forEach(function(x){
              if(x === cur || x.local) return;
              arr.push({role: x.r === 'user' ? 'user' : 'model', text: x.r === 'user' ? (x.c !== undefined ? x.c : x.t) : x.t});
            });
            arr = arr.slice(-24);
            while(arr.length && arr[0].role !== 'user') arr.shift();
            var total = 0; arr.forEach(function(x){ total += x.text.length; });
            while(arr.length > 1 && total > 60000){ total -= arr[0].text.length; arr.shift(); }
            while(arr.length && arr[0].role !== 'user') arr.shift();
            var payload = {role: role, messages: arr, handoff: !!handoff, files: listFiles()};
            cur = {r: 'model', t: ''};
            msgs.push(cur); curEl = addMsg(cur); scrollDown();
            setBusy(true); setStatus('Thinking...');
            N.send(JSON.stringify(payload));
          }

          function send(){
            var text = $('ta').value.trim();
            if(!text || busy) return;
            var mm = text.match(/^\/(prompt|code|image|fix|deploy|explain)\b\s*([\s\S]*)$/i);
            var role = mm ? mm[1].toLowerCase() : '';
            var clean = mm ? mm[2].trim() : text;
            if(role && !clean){ showErr('Add a message after the command.'); return; }
            if(!N.hasKey()){ showKeys(true); return; }
            var h = $('hint'); if(h) h.remove();
            clearBanner();
            $('ta').value = ''; $('ta').style.height = 'auto';

            if(role === 'image'){
              var u = {r: 'user', t: text, c: '', local: true};
              msgs.push(u); addMsg(u);
              cur = {r: 'model', t: '', img: '', local: true};
              msgs.push(cur); curEl = addMsg(cur); scrollDown();
              setBusy(true); setStatus('Making the image...');
              N.send(JSON.stringify({mode: 'image', prompt: clean}));
              return;
            }
            var um = {r: 'user', t: text, c: clean};
            msgs.push(um); addMsg(um);
            startRun(role, false);
          }

          function init(){
            if(N.theme() === 'light') document.documentElement.className = 'light';
            var fs = parseFloat(N.fontScale()) || 1;
            document.documentElement.style.fontSize = (15 * fs) + 'px';

            try{ msgs = JSON.parse(N.loadHistory()) || []; }catch(e){ msgs = []; }
            msgs.forEach(function(m){ addMsg(m); });
            hintIfEmpty(); scrollDown();

            ['/prompt', '/code', '/image', '/fix', '/deploy', '/explain'].forEach(function(c){
              $('cmds').appendChild(btn(c, function(){
                $('ta').value = c + ' ' + $('ta').value.replace(/^\/\w+\s*/, ''); $('ta').focus();
              }));
            });
            $('go').onclick = function(){ if(busy){ N.stop(); } else { send(); } };
            $('ta').oninput = function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 130) + 'px'; };
            armed($('bClear'), 'Clear', function(){ msgs = []; $('msgs').textContent = ''; save(); hintIfEmpty(); });
            $('bKeys').onclick = function(){ showKeys(true); };
            $('tMeter').onclick = function(){ showKeys(true); };
            $('kClose').onclick = function(){ showKeys(false); };
            $('auto').onchange = function(){ N.setAuto(this.checked); };
            $('kp').onchange = function(){ $('kb').hidden = this.value !== 'custom'; };
            $('kAdd').onclick = function(){
              if(N.addKey($('kp').value, $('kl').value, $('kin').value, $('kb').value, $('km').value)){
                $('kin').value = ''; $('kl').value = ''; $('kb').value = ''; $('km').value = ''; $('kMsg').textContent = ''; renderKeys(); showKeys(false);
              } else {
                $('kMsg').style.color = '#d97706';
                $('kMsg').textContent = 'That does not look right. Check the key (and the web address for Custom).';
              }
            };
            showKeys(!N.hasKey());
          }
          init();
          </script>
          </body>
          </html>
          EOF

