        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: workspace-apk
          path: app/build/outputs/apk/debug/app-debug.apk
